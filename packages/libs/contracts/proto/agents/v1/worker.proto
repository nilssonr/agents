syntax = "proto3";

package agents.v1;

service WorkerService {
    rpc SubscribeToJobs(SubscribeRequest) returns (stream JobAssignment);
    rpc ReportJobResult(JobResult) returns (JobAck);
}

message SubscribeRequest {
    string worker_id = 1;
    repeated string capabilities = 2;
}

message JobAssignment {
    string job_id = 1;
    string agent_id = 2;
    string activity_type = 3;
    string params_json = 4;
    string payload_json = 5;
    string step_id = 6;
    string context_json = 7;
}

message JobResult {
    string job_id = 1;
    string agent_id = 2;
    bool success = 3;
    string result_json = 4;
    string error = 5;
    string step_id = 6;
    string logs_json = 7;
}

message JobAck {
    bool accepted = 1;
}
